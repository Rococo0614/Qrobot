services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qrobot-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ

  qrobot:
    build:
      context: .
      args:
        QROBOT_EXTRAS: "onebot,search,copilot"
    container_name: qrobot
    restart: unless-stopped
    user: "${QROBOT_UID:-1000}:${QROBOT_GID:-1000}"
    depends_on:
      - napcat
    env_file:
      - .env
    environment:
      QROBOT_CONFIG: /app/qrobot.json
    volumes:
      - ./qrobot.json:/app/qrobot.json:ro
      - ./data/qrobot:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: ["python", "-m", "qrobot", "run"]
